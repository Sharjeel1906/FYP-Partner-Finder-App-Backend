<!DOCTYPE html>

<head>

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0f2f5;padding:48px 0;">
    <tr><td align="center">
      <table width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.10);">

        <!-- Header -->

          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="padding:44px 48px;text-align:center;">

            <!-- Success icon -->
            <div style="width:72px;height:72px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:50%;margin:0 auto 28px;display:flex;align-items:center;justify-content:center;">
              <span style="color:#ffffff;font-size:36px;line-height:72px;">✓</span>

              Your password has been reset successfully. Go back to the <strong>dEVPartner App</strong> and log in with your new password.

            <div style="background-color:#f8f9ff;border-left:4px solid #667eea;border-radius:8px;padding:18px 24px;text-align:left;">
              <p style="margin:0 0 6px;color:#667eea;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">Next step</p>
              <p style="margin:0;color:#444444;font-size:14px;line-height:1.7;">Open the dEVPartner App and log in with your new password.</p>
            </div>

          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="background-color:#f8f9ff;padding:24px 48px;text-align:center;border-top:1px solid #eeeeee;">
            <p style="color:#aaaaaa;font-size:12px;margin:0;">dEVPartner App — Password Reset Complete</p>
